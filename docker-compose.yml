services:
  projinv.api:
    build:
      context: .
      dockerfile: ProjInv.API/Dockerfile
    image: projinv-api
    container_name: projinv-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=ProjInvestimento;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=true;
    ports:
      - "8080:8080"
    depends_on:
      - sqlserver
    networks:
      - projinv-network
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - projinv-network
    restart: unless-stopped

volumes:
  sql_data:

networks:
  projinv-network:
    driver: bridge